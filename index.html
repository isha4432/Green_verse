<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Green Verse — Quantum–AI for Climate-Resilient Agriculture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<style>
:root{
  --bg:#F5F1E8; --surface:#FDFCF7; --oat:#EDE7D7; --oat2:#E4DCC7; --paper:#F8F5EB;
  --line:#E2DAC5; --line2:#D5CCB2;
  --ink:#22261E; --ink2:#5B6052; --ink3:#8B9080;
  --forest:#2C5E3A; --water:#33739E; --water2:#3F86B0;
  --good:#4C9A57; --warn:#D9A13B; --bad:#C4523C;
  --accent:#2F6B3F; --accent-ink:#FFFFFF;
  --r-s:8px; --r-m:12px; --r-l:16px;
  --sh-s:0 1px 2px rgba(34,38,30,.06),0 1px 6px rgba(34,38,30,.04);
  --sh-m:0 2px 6px rgba(34,38,30,.07),0 8px 28px rgba(34,38,30,.08);
  --f-head:'Space Grotesk',sans-serif; --f-body:'IBM Plex Sans',sans-serif; --f-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:400 13.5px/1.5 var(--f-body);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit;color:inherit}
svg{display:block}
::selection{background:color-mix(in srgb,var(--accent) 25%,transparent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.cap{font:600 10px/1.2 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.mono{font-family:var(--f-mono)}
.muted{color:var(--ink2)}
.hr{height:1px;background:var(--line);border:0}
#app{display:flex;height:100vh}
#sidebar{width:236px;flex:0 0 auto;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:20}
.logo{display:flex;gap:11px;align-items:center;padding:16px 18px 10px}
.logo h1{font:600 17px/1.1 var(--f-head);letter-spacing:-.01em}
.logo .sub{font-size:10.5px;color:var(--ink3);margin-top:2px}
.rolebar{padding:2px 18px 8px}
.rolebar .cap{display:block;margin-bottom:6px}
.navlabel{padding:12px 18px 6px}
nav{flex:1;overflow-y:auto;padding:0 10px}
.navitem{display:flex;align-items:center;gap:11px;width:100%;padding:8px 10px;border-radius:9px;color:var(--ink2);font-weight:500;font-size:13px;margin-bottom:2px;transition:background .15s,color .15s;position:relative}
.navitem svg{width:17px;height:17px;flex:0 0 auto}
.navitem:hover{background:var(--oat);color:var(--ink)}
.navitem.active{background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--accent);font-weight:600}
.navitem.active::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--accent)}
.sidefoot{padding:11px 16px;border-top:1px solid var(--line);font-size:10.5px;color:var(--ink3);line-height:1.6}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#topbar{height:56px;flex:0 0 auto;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 18px;position:relative}
#topbar .tt{min-width:0}
#topbar h2{font:600 16px/1.2 var(--f-head);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .ts{font-size:11.5px;color:var(--ink3);white-space:nowrap}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.tb-sep{width:1px;height:22px;background:var(--line)}
#progress{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:var(--accent);transition:width .45s ease,opacity .3s;opacity:0;z-index:5}
#progress.run{opacity:1;width:82%}
#progress.done{width:100%;opacity:0;transition:width .2s,opacity .4s .3s}
#storeBanner{display:none;padding:10px 22px;background:color-mix(in srgb,var(--warn) 10%,var(--surface));border-bottom:1px solid color-mix(in srgb,var(--warn) 35%,transparent);font-size:12.5px;color:var(--ink2)}
#storeBanner b{color:var(--ink)}
#storeBanner .mono{font-size:11px}
#pages{flex:1;overflow-y:auto;scroll-behavior:smooth}
.page{display:none;padding:20px 22px 34px;animation:pagein .35s ease}
.page.active{display:block}
@keyframes pagein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.btn{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:9px;border:1px solid var(--line2);background:var(--surface);font-weight:500;font-size:12.5px;transition:border-color .15s,background .15s,box-shadow .15s;white-space:nowrap}
.btn:hover{border-color:var(--ink3);box-shadow:var(--sh-s)}
.btn svg{width:14px;height:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,black)}
.btn.ghost{border-color:transparent}
.btn.ghost:hover{background:var(--oat)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ibtn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;color:var(--ink2);border:1px solid transparent}
.ibtn:hover{background:var(--oat);color:var(--ink)}
.ibtn svg{width:15px;height:15px}
.seg{display:inline-flex;background:var(--oat);border-radius:9px;padding:2.5px;gap:2px}
.seg button{padding:5px 12px;border-radius:7px;font-size:12px;font-weight:500;color:var(--ink2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-s);font-weight:600}
.chip-t{display:inline-flex;align-items:center;gap:8px;padding:5px 11px;border:1px solid var(--line2);border-radius:999px;background:var(--surface);font-size:12px;font-weight:500;color:var(--ink2);user-select:none}
.chip-t.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.chip-t .dot{width:7px;height:7px;border-radius:50%;background:var(--line2)}
.chip-t.on .dot{background:var(--accent)}
select.inp,input.inp,textarea.inp{background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:6px 10px;font-size:12.5px}
input.inp:focus,select.inp:focus,textarea.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
input[type=range]{-webkit-appearance:none;appearance:none;height:22px;background:transparent;width:100%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:var(--oat2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--surface);border:2.5px solid var(--accent);margin-top:-5.5px;box-shadow:var(--sh-s);cursor:grab}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:var(--oat2)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--surface);border:2.5px solid var(--accent);cursor:grab}
.sw{position:relative;width:31px;height:18px;border-radius:999px;background:var(--oat2);transition:background .18s;flex:0 0 auto}
.sw::after{content:"";position:absolute;top:2.5px;left:3px;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:var(--sh-s);transition:transform .18s}
.sw.on{background:var(--accent)}
.sw.on::after{transform:translateX(12px)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2.5px 9px;border-radius:999px;font-size:10.5px;font-weight:600;letter-spacing:.02em}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-good{background:color-mix(in srgb,var(--good) 12%,transparent);color:var(--good)}
.b-warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:#9A6D14}
.b-bad{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.b-neutral{background:var(--oat);color:var(--ink2)}
.b-prev{background:color-mix(in srgb,var(--warn) 14%,transparent);color:#8F6410;border:1px dashed color-mix(in srgb,var(--warn) 55%,transparent)}
.b-accent{background:color-mix(in srgb,var(--accent) 11%,transparent);color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--sh-s)}
.card-h{display:flex;align-items:center;gap:8px;padding:13px 16px 0}
.card-h h3{font:600 13px/1.2 var(--f-head);letter-spacing:.01em}
.card-b{padding:12px 16px 16px}
.card-note{padding:0 16px 13px;font-size:10.5px;color:var(--ink3);line-height:1.5}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:13px 15px;box-shadow:var(--sh-s)}
.kpi .cap{display:flex;align-items:center;gap:6px}
.kpi .cap svg{width:12.5px;height:12.5px;color:var(--accent)}
.kpi .v{font:600 23px/1.15 var(--f-head);letter-spacing:-.02em;margin-top:7px}
.kpi .v small{font:500 12px var(--f-body);color:var(--ink3);margin-left:3px}
.kpi .d{font-size:11px;color:var(--ink3);margin-top:3px;display:flex;align-items:center;gap:5px}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}
.grid2e{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px}
@media(max-width:1150px){.grid3{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
@media(max-width:800px){.grid2e,.grid3{grid-template-columns:1fr}}
.tag-ill{display:inline-flex;align-items:center;gap:6px;font:500 10px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);border:1px dashed var(--line2);padding:4px 9px;border-radius:999px}
.tag-ill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--warn)}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{font:600 10px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 10px;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:color-mix(in srgb,var(--oat) 45%,transparent)}
.hbar{display:grid;grid-template-columns:130px 1fr 46px;align-items:center;gap:10px;padding:5px 0;font-size:12px}
.hb-t{height:9px;border-radius:6px;background:var(--oat);overflow:hidden}
.hb-f{height:100%;border-radius:6px}
.hb-v{font:500 11px var(--f-mono);text-align:right;color:var(--ink2)}
.minibar{height:6px;border-radius:4px;background:var(--oat);min-width:52px;overflow:hidden}
.minibar i{display:block;height:100%;border-radius:4px}
.cg{stroke:#E6DECA;stroke-width:1}
.ct{font:400 9.5px var(--f-mono);fill:var(--ink3)}
.legend{display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:11px;color:var(--ink2)}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
.farm-shell{display:flex;gap:12px;height:calc(100vh - 56px - 40px);min-height:520px}
.toolrail{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--sh-s);display:flex;flex-direction:column;padding:7px;gap:3px;align-self:flex-start}
.toolrail .tsep{height:1px;background:var(--line);margin:4px 2px}
.tbtn{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--ink2);position:relative}
.tbtn svg{width:17px;height:17px}
.tbtn:hover{background:var(--oat);color:var(--ink)}
.tbtn.on{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)}
.tbtn[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:46px;top:50%;transform:translateY(-50%);background:var(--ink);color:#F4F1E7;font-size:11px;padding:5px 9px;border-radius:7px;white-space:nowrap;z-index:60;pointer-events:none}
.farm-col{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.farm-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#stage{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px;min-height:0}
#stage.vm-3d,#stage.vm-plan{grid-template-columns:1fr}
#stage.vm-plan .pane-3d{display:none}
#stage.vm-3d .pane-plan{display:none}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--sh-s);display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.pane-h{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.pane-h .cap:first-child{color:var(--ink2)}
.pane-b{flex:1;position:relative;min-height:0}
#planWrap{position:absolute;inset:0}
#planSvg{width:100%;height:100%;touch-action:none}
#planSvg.tool-plot,#planSvg.tool-sensor,#planSvg.tool-tree,#planSvg.tool-pipe{cursor:crosshair}
#planSvg.tool-pan{cursor:grab}
#planSvg.tool-pan.panning{cursor:grabbing}
#glWrap{position:absolute;inset:0}
#glWrap canvas,#sceneHolder canvas{width:100%;height:100%;display:block;touch-action:none}
.gl-fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;background:var(--paper)}
.hud{position:absolute;left:12px;bottom:12px;display:flex;gap:8px;align-items:center;z-index:4;pointer-events:none}
.hud .chip{background:rgba(253,252,247,.88);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:10.5px;color:var(--ink2);backdrop-filter:blur(4px)}
.hud .chip b{color:var(--ink);font-weight:600}
.hud-btn{position:absolute;right:12px;bottom:12px;z-index:5}
.gl-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--paper);z-index:6;transition:opacity .5s;font-size:12px;color:var(--ink2);gap:9px}
.spin{width:15px;height:15px;border:2px solid var(--line2);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.plan-tools{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:4px;z-index:4;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:var(--sh-s)}
.farm-status{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:11.5px;color:var(--ink2);box-shadow:var(--sh-s)}
.farm-status b{font:600 12px var(--f-mono);color:var(--ink)}
.farm-status .fs-i{display:flex;align-items:center;gap:6px}
.farm-status svg{width:13px;height:13px;color:var(--accent)}
.pl-name{font:600 2.1px var(--f-head);fill:#34382E}
.pl-sub{font:400 1.4px var(--f-body);fill:#75796B}
.pl-fix{font:500 1.5px var(--f-body);fill:#6E7362}
.plotg{cursor:pointer}
.plotg .prect{transition:stroke-width .12s}
.plotg.sel .prect{stroke:var(--accent)!important;stroke-width:.75!important}
.plotg.sel .selc{display:block}
.selc{display:none;fill:var(--accent)}
.wflow{stroke-dasharray:1.4 2.4;animation:flowdash 1.1s linear infinite}
@keyframes flowdash{to{stroke-dashoffset:-3.8}}
.pv-rect{fill:transparent;stroke:var(--accent);stroke-width:.4;stroke-dasharray:1.2 .9}
.pv-line{stroke:var(--accent);stroke-width:.35;stroke-dasharray:1.2 .9;fill:none}
.pipev{fill:var(--accent)}
.envdot{pointer-events:none}
#panel{position:fixed;top:56px;right:0;bottom:0;width:346px;background:var(--surface);border-left:1px solid var(--line);box-shadow:-12px 0 32px rgba(34,38,30,.09);transform:translateX(105%);transition:transform .32s cubic-bezier(.32,.72,.28,1);z-index:40;display:flex;flex-direction:column}
#panel.open{transform:none}
.panel-h{display:flex;align-items:center;gap:9px;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel-h h3{font:600 14px var(--f-head);flex:1}
.panel-b{flex:1;overflow-y:auto;padding:14px 16px 22px}
.frow{margin-bottom:13px}
.frow label{display:block;margin-bottom:5px}
.frow .inp{width:100%}
.frow2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px dashed color-mix(in srgb,var(--line) 70%,transparent);font-size:12.5px}
.kv b{font:600 12px var(--f-mono)}
.stat-strip{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 12px;align-items:center}
#modalRoot{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(34,38,30,.4);backdrop-filter:blur(3px)}
#modalRoot.open{display:flex}
.modal{background:var(--surface);border-radius:var(--r-l);width:min(620px,92vw);max-height:86vh;display:flex;flex-direction:column;box-shadow:var(--sh-m);animation:mup .28s cubic-bezier(.32,.72,.28,1)}
@keyframes mup{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-h h3{font:600 15px var(--f-head);flex:1}
.modal-b{padding:18px 20px;overflow-y:auto}
.modal-f{padding:13px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px;align-items:center}
#toasts{position:fixed;right:18px;bottom:18px;z-index:80;display:flex;flex-direction:column;gap:8px}
.toast{display:flex;align-items:center;gap:9px;background:var(--ink);color:#F2EFE5;padding:10px 15px;border-radius:11px;font-size:12.5px;box-shadow:var(--sh-m);animation:tin .3s cubic-bezier(.32,.72,.28,1);max-width:340px}
.toast svg{width:15px;height:15px;flex:0 0 auto}
.toast.ok svg{color:#8FD49A}.toast.warn svg{color:#E7B45A}.toast.info svg{color:#9CC4E0}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.tpl-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tpl-card{text-align:left;border:1px solid var(--line);border-radius:var(--r-m);background:var(--paper);padding:10px;transition:border-color .15s,box-shadow .15s}
.tpl-card:hover{border-color:var(--accent);box-shadow:var(--sh-s)}
.tpl-card h4{font:600 13px var(--f-head);margin:8px 2px 2px}
.tpl-card p{font-size:11px;color:var(--ink2);margin:0 2px}
.tpl-card svg{width:100%;height:auto;border-radius:8px;border:1px solid var(--line)}
.swatches{display:flex;gap:8px;align-items:center}
.swatch{width:22px;height:22px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line2);transition:transform .12s}
.swatch:hover{transform:scale(1.12)}
.swatch.on{box-shadow:0 0 0 2px var(--ink)}
#accPop{position:fixed;z-index:70;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh-m);padding:12px 14px;display:none}
#accPop.open{display:block;animation:mup .2s ease}
.exp-row{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface);margin-bottom:8px;transition:border-color .15s}
.exp-row:hover{border-color:var(--ink3)}
.exp-row.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
.exp-row .eid{font:600 11px var(--f-mono);color:var(--ink3)}
.preview-page{background:#fff;border:1px solid var(--line2);border-radius:6px;padding:22px 24px;box-shadow:var(--sh-m)}
.ql-card{position:relative;overflow:hidden}

<script type="module">
import * as THREE from 'three';

/* =====================================================================
   GREEN VERSE — frontend demo build (UI/UX only)
   All computation is local & illustrative. No backend, AI inference or
   quantum execution is performed. “BACKEND HOOK” comments mark where
   FastAPI services connect later.
   ===================================================================== */

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const fmt=(n,d=0)=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const icons=()=>{ try{ lucide.createIcons(); }catch(e){} };
function toast(msg,kind='ok'){
  const ic={ok:'check',warn:'info',info:'info'}[kind]||'info';
  const t=document.createElement('div'); t.className='toast '+kind;
  t.innerHTML=`<i data-lucide="${ic}"></i><span>${msg}</span>`;
  $('#toasts').appendChild(t); icons();
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .4s';setTimeout(()=>t.remove(),420);},3400);
}
function tween(dur,step,done){
  if(RM||dur<=0){step(1);done&&done();return{cancel(){}};}
  const t0=performance.now(); let raf;
  const fr=t=>{let k=Math.min(1,(t-t0)/dur);const e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;step(e);
    if(k<1)raf=requestAnimationFrame(fr);else done&&done();};
  raf=requestAnimationFrame(fr);
  return{cancel(){cancelAnimationFrame(raf);}};
}
const debounce=(fn,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};};
function hexMix(a,b,t){
  const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);
  const r=Math.round(((pa>>16)&255)+(((pb>>16)&255)-((pa>>16)&255))*t),
        g=Math.round(((pa>>8)&255)+(((pb>>8)&255)-((pa>>8)&255))*t),
        bl=Math.round((pa&255)+((pb&255)-(pa&255))*t);
  return '#'+((1<<24)+(r<<16)+(g<<8)+bl).toString(16).slice(1);
}
function webglOK(){try{const c=document.createElement('canvas');return !!(c.getContext('webgl2')||c.getContext('webgl'));}catch(e){return false;}}
const HAS3D=webglOK();

/* =====================================================================
   SAFE STORAGE LAYER
   Sandboxed frames without allow-same-origin throw on ANY access to
   localStorage/sessionStorage. Probe first; fall back honestly:
   localStorage → sessionStorage → in-memory (this session only).
   Keys are unchanged: “gv-demo”, “gv-demo-backup-…”.
   ===================================================================== */
const Storage=(()=>{
  let mode='memory', impl=null, err=null;
  function canUse(obj){
    try{ const k='__gv_probe__'; obj.setItem(k,'1'); obj.removeItem(k); return true; }
    catch(e){ err=e; return false; }
  }
  try{ if(typeof localStorage!=='undefined'&&canUse(localStorage)){ mode='local'; impl=localStorage; } }catch(e){ err=e; }
  if(!impl){ try{ if(typeof sessionStorage!=='undefined'&&canUse(sessionStorage)){ mode='session'; impl=sessionStorage; } }catch(e2){} }
  const mem=Object.create(null);
  return {
    mode,
    get persistent(){ return mode==='local'; },
    get error(){ return mode==='memory'?String((err&&err.message)||'storage blocked by sandbox'):''; },
    get(k){ if(impl){ try{ return impl.getItem(k); }catch(e){} } return Object.prototype.hasOwnProperty.call(mem,k)?mem[k]:null; },
    set(k,v){ if(impl){ try{ impl.setItem(k,v); return true; }catch(e){} } mem[k]=String(v); return false; },
    remove(k){ if(impl){ try{ impl.removeItem(k); }catch(e){} } delete mem[k]; },
    keys(){ if(impl){ try{ return Object.keys(impl); }catch(e){} } return Object.keys(mem); },
  };
})();

/* =====================================================================
   CENTRAL GREEN VERSE BACKEND API CLIENT
   ===================================================================== */
const API_BASE_URL = window.__GV_API_BASE_URL || (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
  ? 'http://127.0.0.1:8000/api' 
  : '/api');

const GreenVerseAPI = {
  BASE_URL: API_BASE_URL,
  isOnline: false,
  async request(endpoint, options = {}) {
    const ep = endpoint.startsWith('/') ? endpoint : '/' + endpoint;
    const candidateUrls = [
      `${this.BASE_URL}${ep}`,
      `/api${ep}`,
      `http://127.0.0.1:8000/api${ep}`,
      `http://localhost:8000/api${ep}`
    ];
    const uniqueUrls = [...new Set(candidateUrls)];
    const timeoutMs = options.timeout || 9000;
    const headers = { 'Content-Type': 'application/json', 'Accept': 'application/json', ...(options.headers || {}) };
    const token = Storage.get('gv_token');
    if (token) headers['Authorization'] = `Bearer ${token}`;

    let lastErr = null;
    for (const url of uniqueUrls) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const res = await fetch(url, { ...options, headers, signal: controller.signal });
        clearTimeout(timeoutId);
        if (!res.ok) {
          let errDetail = `HTTP ${res.status}`;
          try { const j = await res.json(); if (j && j.detail) errDetail = typeof j.detail === 'string' ? j.detail : JSON.stringify(j.detail); } catch(e){}
          const err = new Error(errDetail); err.status = res.status; throw err;
        }
        this.isOnline = true;
        const ct = res.headers.get('content-type') || '';
        if (ct.includes('application/pdf') || ct.includes('octet-stream')) return await res.blob();
        return await res.json();
      } catch (err) {
        clearTimeout(timeoutId);
        lastErr = err;
        if (err.status && err.status >= 400 && err.status < 500 && err.status !== 404) {
          throw err;
        }
      }
    }
    this.isOnline = false;
    throw lastErr || new Error('Failed to connect to Green Verse backend');
  },
  get(endpoint, options) { return this.request(endpoint, { ...options, method: 'GET' }); },
  post(endpoint, data, options) { return this.request(endpoint, { ...options, method: 'POST', body: JSON.stringify(data) }); },
  put(endpoint, data, options) { return this.request(endpoint, { ...options, method: 'PUT', body: JSON.stringify(data) }); },
  delete(endpoint, options) { return this.request(endpoint, { ...options, method: 'DELETE' }); }
};
window.GreenVerseAPI = GreenVerseAPI;

function planKind(p){ return p&&p.kind?p.kind:(Array.isArray(p&&p.zones)?'crop':(p&&p.water?'water':null)); }
function normalizePlan(p){
  if(!p||typeof p!=='object')return null;
  const kind=planKind(p);
  if(kind!=='crop'&&kind!=='water')return null;
  if(kind==='crop'&&(!Array.isArray(p.zones)||!p.zones.length))return null;
  return {...p,kind};
}
function makeBackup(raw){
  try{
    Storage.set(BACKUP_PREFIX+Date.now(),String(raw));
    const keys=Storage.keys().filter(k=>k.startsWith(BACKUP_PREFIX)).sort();
    while(keys.length>BACKUPS_KEPT){ Storage.remove(keys[0]); keys.shift(); }
  }catch(e){}
}
function backupList(){
  try{ return Storage.keys().filter(k=>k.startsWith(BACKUP_PREFIX)).sort()
    .map(k=>{ const raw=Storage.get(k)||''; const ts=Number(k.slice(BACKUP_PREFIX.length));
      return {key:k,at:isFinite(ts)&&ts>0?new Date(ts):null,size:raw.length}; }); }
  catch(e){ return []; }
}
function loadStore(){
  if(Storage.mode==='memory')
    return {status:'unavailable',reason:Storage.error||'storage blocked'};
  let raw=null;
  try{ raw=Storage.get(STORE_KEY); }
  catch(e){ return {status:'unavailable',reason:String(e&&e.message||e)}; }
  if(raw==null||raw==='') return {status:'empty'};
  makeBackup(raw);                                   // checkpoint BEFORE anything else
  let data=null;
  try{ data=JSON.parse(raw); }
  catch(e){ return {status:'corrupt',raw}; }
  if(data&&data.v===SCHEMA_VERSION) return {status:'ok',data,savedAt:data.savedAt};
  if(data&&typeof data==='object'&&(data.tasks||data.saved||data.accent))
    return {status:'migrated',data:migrateLegacy(data)};
  return {status:'unknown',raw};
}
function migrateLegacy(d){
  buildTasks();
  const tasks=state.tasks.map((t,i)=>{
    const rec=Array.isArray(d.tasks)?d.tasks[i]:null;
    return {id:t.id,done:!!(rec&&typeof rec==='object'?rec.done:rec)};
  });
  const plans=[],quarantine=[];
  (Array.isArray(d.saved)?d.saved:[]).forEach(p=>{
    const n=normalizePlan(p);
    if(n)plans.push(n); else if(p)quarantine.push(p);
  });
  return {v:SCHEMA_VERSION,savedAt:new Date().toISOString(),
    accent:typeof d.accent==='string'?d.accent:undefined,
    tasks,plans,quarantine};
}
function applyStore(d){
  if(!d||typeof d!=='object')return;
  if(typeof d.accent==='string'&&/^#[0-9a-fA-F]{6}$/.test(d.accent))state.accent=d.accent;
  if(d.role==='farmer'||d.role==='head')state.role=d.role;
  if(d.layers&&typeof d.layers==='object')state.layers={...state.layers,...d.layers};
  if(Array.isArray(d.tasks)&&d.tasks.length){
    buildTasks();
    const byId=new Map(),byLabel=new Map();
    d.tasks.forEach(t=>{ if(t&&t.id!=null)byId.set(t.id,t); if(t&&t.label)byLabel.set(t.label,t); });
    state.tasks.forEach((t,i)=>{
      const rec=byId.get(t.id)||byLabel.get(t.label)||d.tasks[i]||null;
      if(rec) t.done=!!(rec&&typeof rec==='object'?rec.done:rec);
    });
  }
  if(Array.isArray(d.plans)){
    state.savedPlans=[];
    state._quarantine=Array.isArray(d.quarantine)?[...d.quarantine]:[];
    d.plans.forEach(p=>{ const n=normalizePlan(p); if(n)state.savedPlans.push(n); else if(p)state._quarantine.push(p); });
  }
  if(Array.isArray(d.experiments)&&d.experiments.length)
    state.experiments=d.experiments.filter(x=>x&&x.id);
  if(Array.isArray(d.compare))
    state.compare=new Set(d.compare.filter(id=>state.experiments.some(e=>e.id===id)));
  if(d.farm&&Array.isArray(d.farm.plots)&&d.farm.plots.length){
    state.farm=d.farm; state.alloc={}; state.sel=null;
  }
  if(d.alloc&&typeof d.alloc==='object'&&Object.keys(d.alloc).length)state.alloc={...d.alloc};
  if(typeof d.budget==='number'&&d.budget>=0)state.budget=d.budget;
  if(d.clim)state.clim={...state.clim,...d.clim};
  if(d.cost)state.cost={...state.cost,...d.cost};
  if(d.water)state.water={...state.water,...d.water};
  if(d.soil)state.soil={...state.soil,...d.soil};
  if(d.rec)state.rec={...state.rec,...d.rec};
  if(d.mc){
    if(Array.isArray(d.mc.zones)&&d.mc.zones.length)state.mc.zones=d.mc.zones;
    if(d.mc.layers)state.mc.layers={...state.mc.layers,...d.mc.layers};
    if(typeof d.mc.week==='number')state.mc.week=clamp(d.mc.week,0,16);
  }
  if(d.location&&typeof d.location==='object'&&d.location.latitude!=null&&d.location.longitude!=null){
    state.location={...state.location,...d.location};
  }
  if(d.locationData&&typeof d.locationData==='object'&&d.locationData.latitude!=null){
    if(Math.abs(d.locationData.latitude-state.location.latitude)<0.01&&Math.abs(d.locationData.longitude-state.location.longitude)<0.01){
      state.locationData=d.locationData;
    }
  }
  if(Array.isArray(d.certSubs))state.certSubs=d.certSubs.filter(c=>c&&c.id);
  if(Array.isArray(d.cropGuides))state.cropGuides=d.cropGuides.filter(g=>g&&g.id);
}
function buildPayload(){

}

function fallbackCopy(txt){

function importBackup(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      makeBackup(JSON.stringify(buildPayload()));     // checkpoint current state first
      let norm=null;
      if(data&&data.v===SCHEMA_VERSION)norm=data;
      else if(data&&(data.tasks||data.saved||data.accent))norm=migrateLegacy(data);
      if(!norm)throw new Error('unrecognised backup format');

/* ---------------- derived values ---------------- */
const plotArea=p=>p ? (p.area !== undefined ? Number(p.area) : Number(p.w||16) * Number(p.h||14)) : 0;
const plotDemand=p=>{
  if(!p) return 0;
  const c = CROPS[p.crop] || CROPS.tomato;
  const stg = p.stage !== undefined ? p.stage : (p.crop_stage !== undefined ? p.crop_stage : 2);
  const sf = SF[stg] || 1.0;
  return plotArea(p) * c.mm * sf / 1000;
};
const totalDemand=()=>state.farm && state.farm.plots ? state.farm.plots.reduce((a,p)=>a+plotDemand(p),0) : 0;
const totalArea=()=>state.farm && state.farm.plots ? state.farm.plots.reduce((a,p)=>a+plotArea(p),0) : 0;
const lineLen=()=>state.farm && state.farm.lines ? state.farm.lines.reduce((a,l)=>a+l.pts.slice(1).reduce((b,q,i)=>b+Math.hypot(q[0]-l.pts[i][0],q[1]-l.pts[i][1]),0),0) : 0;
const riskOf=p=>{
  if(!p) return 14;
  const moist = typeof p.moisture === 'number' ? p.moisture : (state.soil && state.soil.moist) || 45;
  const temp = typeof p.temp === 'number' ? p.temp : (state.locationData && state.locationData.temperature) || 25;
  return clamp(14+(p.condition==='stressed'?32:p.condition==='critical'?58:0)+(45-moist)*.45+(temp-24)*2.2,4,96);
};
const riskClass=r=>r<30?['Low','b-good']:r<60?['Watch','b-warn']:['High','b-bad'];
function riskColor(r){return r<50?hexMix('#5D9B62','#D9A13B',r/50):hexMix('#D9A13B','#C4523C',clamp((r-50)/45,0,1));}
function envVal(p){return state.layers.env==='moisture'?p.moisture:state.layers.env==='temp'?p.temp:p.rain;}
function envColor(v){
  if(state.layers.env==='moisture')return hexMix('#C9A96B','#3E7CA6',clamp((v-10)/80,0,1));
  if(state.layers.env==='temp')return hexMix('#7FA8BC','#C4522D',clamp((v-17)/17,0,1));
  return hexMix('#D7DEC9','#33658F',clamp(v/25,0,1));

function allocColor(r){return r>=.999?'#5E93B8':hexMix('#C9A96B','#5E93B8',clamp(r,0,1));}
const scenRisk=(p,s)=>clamp(riskOf(p)+s.temp*5.5+Math.max(0,-s.rain)*.5-s.moist*.9+Math.max(0,-s.water)*.15,3,98);
function initAlloc(){
  const d=totalDemand(),b=state.budget;

}
function costItems(){
  const c=state.cost,f=state.farm;

    {k:'sensor',label:'Soil / micro-climate sensor',unit:'ea',qty:f.sensors.length},
    {k:'weather',label:'Weather station',unit:'ea',qty:f.weather?1:0},

const costTotal=()=>costItems().reduce((a,i)=>a+i.sub,0);
function waterCalc(w){
  const col=w.area*(w.rainMM/1000)*w.coeff, usable=Math.max(0,col-0.5);
  return {col,usable,fillEv:usable>0?w.cap/usable:0,weeks:w.demand>0?Math.min(99,w.cap/w.demand):0,over:Math.max(0,usable-w.cap)};
}
const MC_SHARE={single:[1,0],inter:[.5,.5],mixed:[.5,.5],seq:[.5,.5],rotation:[.5,.5]};
function mcMetrics(zones){
  zones=zones||[]; let water=0; const crops=new Set();
  zones.forEach(z=>{
    const s=MC_SHARE[z.mode]||MC_SHARE.single, c1=z.crops&&z.crops[0], c2=(z.crops&&z.crops[1])||c1;
    if(!c1)return;
    [[c1,s[0]],[c2,s[1]]].forEach(([c,sh])=>{crops.add(c);water+=sh*120*CROPS[c].mm/1000;});
  });
  return {water:+water.toFixed(1),div:crops.size,crops:[...crops],

function chartXY({w=560,h=190,ymax=100,xmax=null,series=[],yticks=4,xticks=null,yd=0,pl=34,pr=10,pt=12,pb=22}){
  const X=i=>pl+i/((xticks?xticks.length:series[0].pts.length)-1)*(w-pl-pr);
  const Y=v=>h-pb-(v/ymax)*(h-pt-pb);
  let s='';
  for(let i=0;i<=yticks;i++){const v=ymax*i/yticks,y=Y(v);
    s+=`<line x1="${pl}" x2="${w-pr}" y1="${y}" y2="${y}" class="cg"/><text x="${pl-5}" y="${y+3}" text-anchor="end" class="ct">${fmt(v,yd)}</text>`;}
  if(xticks)xticks.forEach((lb,i)=>{s+=`<text x="${X(i)}" y="${h-6}" text-anchor="middle" class="ct">${lb}</text>`;});
  for(const sr of series){
    const px=sr.xy?(p)=>pl+p[0]/xmax*(w-pl-pr):(p,i)=>X(i);
    const d=sr.pts.map((p,i)=>`${i?'L':'M'}${px(p,i).toFixed(1)} ${Y(sr.xy?p[1]:p).toFixed(1)}`).join('');
    if(sr.area){const last=sr.pts.length-1;
      s+=`<path d="${d}L${px(sr.pts[last],last).toFixed(1)} ${Y(0)}L${px(sr.pts[0],0).toFixed(1)} ${Y(0)}Z" fill="${sr.color}" opacity=".1"/>`;}
    s+=`<path d="${d}" fill="none" stroke="${sr.color}" stroke-width="2" ${sr.dash?`stroke-dasharray="4 4"`:''} stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto">${s}</svg>`;
}
function chartCols({w=560,h=200,ymax=100,cats=[],series=[],yd=0,pl=32,pr=8,pt=12,pb=26}){
  let s='';const Y=v=>h-pb-(v/ymax)*(h-pt-pb);
  for(let i=0;i<=4;i++){const v=ymax*i/4,y=Y(v);
    s+=`<line x1="${pl}" x2="${w-pr}" y1="${y}" y2="${y}" class="cg"/><text x="${pl-5}" y="${y+3}" text-anchor="end" class="ct">${fmt(v,yd)}</text>`;}
  const gw=(w-pl-pr)/Math.max(1,cats.length), bw=Math.min(26,(gw*.62)/series.length);
  cats.forEach((c,ci)=>{
    const cx=pl+gw*ci+gw/2;
    series.forEach((sr,si)=>{
      const x=cx-(bw*series.length)/2+si*bw, v=(sr.values&&sr.values[ci])||0;
      s+=`<rect x="${(x+1).toFixed(1)}" y="${Y(v).toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${(Y(0)-Y(v)).toFixed(1)}" rx="2.5" fill="${sr.color}"/>`;
    });
    s+=`<text x="${cx.toFixed(1)}" y="${h-8}" text-anchor="middle" class="ct">${c}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto">${s}</svg>`;
}

const isWheatPlant=p=>p.userData.crop==='wheat';
function setPlantG(plant,g,extra=1,tSec=0){

        if(ptr&&!ptr.moved&&ptr.b===0&&state.page==='farm'){
          const r=canvas.getBoundingClientRect();
          ndc.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
          ray.setFromCamera(ndc,cam);
          const hit=ray.intersectObjects(pickables,false)[0];
          selectPlot(hit?hit.object.userData.plotId:null);
        }
        ptr=null;
      });
      canvas.addEventListener('contextmenu',e=>e.preventDefault());
      canvas.addEventListener('wheel',e=>{e.preventDefault();
        this.v.dist=clamp(this.v.dist*Math.exp(e.deltaY*.0011),28,240);this.applyCam();},{passive:false});
    },
  };
  api.bindControls(); api.applyCam();
  if(mini){api.v={theta:.7,phi:.95,dist:100,tx:50,tz:26};api.applyCam();}
  return api;
}

let F3=null,M3=null,CV=null,WV=null,MV=null,farmBuilt=false;
const rafT={last:0};
function runScene(api,t,dt,label){
  if(!api||api._dead)return;
  try{ api.frame(t,dt); }
  catch(err){ api._dead=true; console.error('[GreenVerse] '+label+' scene disabled after frame error:',err); }
}
function frame(t){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(t-rafT.last)/1000)||.016; rafT.last=t;
  if(document.hidden)return;
  if(F3&&state.page==='farm'&&state.viewMode!=='plan')runScene(F3,t,dt,'farm');
  if(M3&&state.page==='overview'&&state.role==='farmer')runScene(M3,t,dt,'mini');
  if(CV&&state.page==='cultivate')runScene(CV,t,dt,'cultivation');
  if(WV&&state.page==='water')runScene(WV,t,dt,'water');
  if(MV&&state.page==='multicrop')runScene(MV,t,dt,'multicrop');
}
requestAnimationFrame(frame);

/* ---------------- plan interactions ---------------- */
const plan={drag:null,draw:null,pipe:null};
function svgPt(e){const svg=$('#planSvg');if(!svg)return null;
  return new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse());}
function setTool(t){
  state.tool=t;
  $$('.toolrail .tbtn[data-act=tool]').forEach(b=>b.classList.toggle('on',b.dataset.arg===t));
  const svg=$('#planSvg');
  if(svg)svg.setAttribute('class','tool-'+t);
}
function attachPlanEvents(){
  const svg=$('#planSvg');
  svg.addEventListener('pointerdown',e=>{
    const pt=svgPt(e); if(!pt)return;
    const t=state.tool;
    if(t==='pan'){plan.drag={mode:'pan',sx:e.clientX,sy:e.clientY,pv:{...state.pv}};svg.classList.add('panning');e.preventDefault();return;}
    if(t==='select'){
      const g=e.target.closest('[data-plot]');
      if(g){const p=state.farm.plots.find(x=>x.id===g.dataset.plot);
        plan.drag={mode:'plot',id:p.id,ox:pt.x-p.x,oy:pt.y-p.y,moved:false};}
      return;
    }
    if(t==='plot'){plan.draw={x0:clamp(pt.x,0,FARM.w),y0:clamp(pt.y,0,FARM.h)};showPrev();e.preventDefault();return;}
    if(t==='pipe'){
      if(!plan.pipe)plan.pipe=[];
      if(plan.pipe.length>1&&Math.hypot(pt.x-plan.pipe[0][0],pt.y-plan.pipe[0][1])<2){finishPipe();return;}
      plan.pipe.push([+pt.x.toFixed(1),+pt.y.toFixed(1)]);renderPlan();updatePrevLine(pt);return;}
    if(t==='sensor'||t==='tree'){
      if(pt.x<0||pt.y<0||pt.x>FARM.w||pt.y>FARM.h)return;
      if(t==='sensor')state.farm.sensors.push({id:uid('s'),x:+pt.x.toFixed(1),y:+pt.y.toFixed(1),type:Math.random()>.5?'moisture':'temp'});
      else state.farm.trees.push({id:uid('t'),x:+pt.x.toFixed(1),y:+pt.y.toFixed(1),kind:Math.random()>.6?'cypress':'olive'});
      renderPlan();F3&&F3.rebuild();farmMetrics();costIfOpen();toast(t==='sensor'?'Soil sensor placed (illustrative)':'Tree planted (visual element)','ok');
      return;}
  });
  svg.addEventListener('pointermove',e=>{
    const pt=svgPt(e);
    if(plan.drag&&plan.drag.mode==='pan'){
      const k=plan.drag.pv.w/svg.getBoundingClientRect().width;
      state.pv.x=plan.drag.pv.x-(e.clientX-plan.drag.sx)*k;
      state.pv.y=plan.drag.pv.y-(e.clientY-plan.drag.sy)*k;
      svg.setAttribute('viewBox',`${state.pv.x} ${state.pv.y} ${state.pv.w} ${state.pv.h}`);return;}
    if(plan.drag&&plan.drag.mode==='plot'){
      const p=state.farm.plots.find(x=>x.id===plan.drag.id);
      p.x=clamp(+(pt.x-plan.drag.ox).toFixed(1),-4,FARM.w-p.w+4);
      p.y=clamp(+(pt.y-plan.drag.oy).toFixed(1),-4,FARM.h-p.h+4);
      plan.drag.moved=true;
      const g=svg.querySelector(`[data-plot="${p.id}"]`);g&&g.setAttribute('transform',`translate(${p.x} ${p.y})`);
      return;}
    if(plan.draw){drawPrev(pt);return;}
    if(plan.pipe){updatePrevLine(pt);return;}
  });
  const endDrag=e=>{
    if(plan.drag&&plan.drag.mode==='pan'){plan.drag=null;$('#planSvg').classList.remove('panning');return;}
    if(plan.drag&&plan.drag.mode==='plot'){
      if(!plan.drag.moved)selectPlot(plan.drag.id);
      else{F3&&F3.rebuild();renderPlan();farmMetrics();}
      plan.drag=null;return;}
    if(plan.draw){
      const pt=svgPt(e);const d=plan.draw;
      const w=Math.abs(pt.x-d.x0),h=Math.abs(pt.y-d.y0);
      if(w>=3&&h>=3){
        const p=P('New Plot','lettuce',Math.min(d.x0,pt.x),Math.min(d.y0,pt.y),+w.toFixed(1),+h.toFixed(1),1,'good',45,24,12);
        state.farm.plots.push(p);selectPlot(p.id);F3&&F3.rebuild();farmMetrics();costIfOpen();
        toast('Plot added — configure it in the side panel','ok');
      }
      plan.draw=null;hidePrev();renderPlan();return;}
  };
  svg.addEventListener('pointerup',endDrag);
  svg.addEventListener('pointerleave',()=>{if(plan.drag&&plan.drag.mode==='plot'){plan.drag=null;renderPlan();}});
  svg.addEventListener('dblclick',()=>{if(plan.pipe)finishPipe();});
  svg.addEventListener('wheel',e=>{
    e.preventDefault();
    const pt=svgPt(e),f=e.deltaY>0?1.12:.89;
    const w=clamp(state.pv.w*f,30,160),h=w*(state.pv.h/state.pv.w);
    state.pv.x=pt.x-(pt.x-state.pv.x)*(w/state.pv.w);
    state.pv.y=pt.y-(pt.y-state.pv.y)*(h/state.pv.h);
    state.pv.w=w;state.pv.h=h;
    svg.setAttribute('viewBox',`${state.pv.x} ${state.pv.y} ${state.pv.w} ${state.pv.h}`);
  },{passive:false});
}
function showPrev(){$('#drawPrev')&&($('#drawPrev').style.display='');}
function hidePrev(){$('#drawPrev')&&($('#drawPrev').style.display='none');}
function drawPrev(pt){
  const r=$('#pvRect');if(!r)return;const d=plan.draw;
  r.setAttribute('x',Math.min(d.x0,pt.x));r.setAttribute('y',Math.min(d.y0,pt.y));
  r.setAttribute('width',Math.abs(pt.x-d.x0));r.setAttribute('height',Math.abs(pt.y-d.y0));
  $('#drawPrev').style.display='';
}
function updatePrevLine(pt){
  if(!plan.pipe)return;
  const pl=$('#pvLine');if(!pl)return;
  pl.setAttribute('points',plan.pipe.concat([[pt.x,pt.y]]).map(p=>p.join(',')).join(' '));
  $('#pvVerts').innerHTML=plan.pipe.map(p=>`<circle class="pipev" cx="${p[0]}" cy="${p[1]}" r=".5"/>`).join('');
  $('#drawPrev').style.display='';
}
function finishPipe(){
  if(plan.pipe&&plan.pipe.length>1){
    state.farm.lines.push({id:uid('l'),pts:plan.pipe.map(p=>[p[0],p[1]])});
    toast('Irrigation line laid (visual element)','ok');costIfOpen();
  }
  plan.pipe=null;hidePrev();renderPlan();F3&&F3.rebuild();farmMetrics();
}
function renderPlan(mode){
  const wrap=$('#planWrap');if(!wrap)return;
  wrap.innerHTML=planSVG(state,{id:'planSvg',mode:mode||'plan'});

  $('#planLegend').innerHTML=mode&&mode!=='plan'?planLegendHTML(mode):'';

function selectPlot(id){

function formatSelectedLoc(loc){
  loc = loc || state.location || {};
  const city = loc.city || loc.place_name || 'Kurnool';
  const parts = [city];
  if(loc.district && loc.district.toLowerCase() !== city.toLowerCase()) parts.push(loc.district);
  if(loc.state && loc.state.toLowerCase() !== city.toLowerCase() && loc.state.toLowerCase() !== (loc.district||'').toLowerCase()) parts.push(loc.state);
  if(loc.country) parts.push(loc.country);
  return parts.join(', ');
}

async function fetchLocationData(loc, forceRefresh=false){
  loc = loc || state.location || {};
  if(loc.latitude == null || loc.longitude == null) return;
  
  state.locationData = null;
  state.locationDataLoading = true;
  state.locationDataError = null;
  if(state.page === 'overview') renderOverview();
  
  try {
    const lat = Number(loc.latitude);
    const lon = Number(loc.longitude);
    const name = encodeURIComponent(loc.place_name || loc.city || 'Location');
    const st = encodeURIComponent(loc.state || '');
    const ctry = encodeURIComponent(loc.country || 'India');
    const refreshParam = forceRefresh ? '&refresh=true' : '';
    
    let data = null;
    try {
      data = await window.GreenVerseAPI.get(`/location/data?lat=${lat}&lon=${lon}&name=${name}&state=${st}&country=${ctry}${refreshParam}`);
    } catch(apiErr) {
      // Direct in-browser Open-Meteo fallback for Netlify static deployments
      const omRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,precipitation,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=auto`);
      if(omRes.ok){
        const om = await omRes.json();
        const cur = om.current || {};
        const daily = om.daily || {};
        const wCodes = {0:'Clear sky',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',51:'Light drizzle',61:'Slight rain',63:'Moderate rain',65:'Heavy rain',80:'Rain showers',95:'Thunderstorm'};
        data = {
          location: loc.place_name || loc.city || 'Current Location',
          latitude: lat,
          longitude: lon,
          temperature: typeof cur.temperature_2m === 'number' ? cur.temperature_2m : 26.4,
          humidity: typeof cur.relative_humidity_2m === 'number' ? cur.relative_humidity_2m : 60,
          precipitation_mm: typeof cur.precipitation === 'number' ? cur.precipitation : 0.0,
          wind_speed_kmh: typeof cur.wind_speed_10m === 'number' ? cur.wind_speed_10m : 12.0,
          weather_condition: wCodes[cur.weather_code] || 'Partly cloudy',
          forecast_today: {
            temp_max: daily.temperature_2m_max ? daily.temperature_2m_max[0] : 32.0,
            temp_min: daily.temperature_2m_min ? daily.temperature_2m_min[0] : 22.0,
            rainfall_mm: daily.precipitation_sum ? daily.precipitation_sum[0] : 0.0
          },
          timestamp: new Date().toISOString()
        };
      } else {
        throw apiErr;
      }
    }
    
    if(data && (data.temperature !== undefined || data.current !== undefined)){
      state.locationData = data;
      state.locationDataLoading = false;
      state.locationDataError = null;
      
      // Synchronize ambient environmental baselines across application
      if(typeof data.temperature === 'number'){
        state.farm.plots.forEach((p, idx) => {
          p.temp = +(data.temperature + ((p.seed || idx) % 3 - 1) * 0.8).toFixed(1);
        });
      }
      if(typeof data.humidity === 'number'){
        state.soil.moist = Math.min(85, Math.max(15, Math.round(data.humidity * 0.72)));
      }
      if(data.forecast_today && typeof data.forecast_today.rainfall_mm === 'number'){
        const rainVal = Math.round(data.forecast_today.rainfall_mm * 1.5);
        state.water.rainMM = Math.max(5, Math.min(60, rainVal || 25));
      }
      
      persist();
      if(state.page === 'overview') renderOverview();
      else if(state.page === 'headov') renderHeadOverview();
      else if(state.page === 'ai') renderAI();
      else if(state.page === 'climate') renderClimate();
      else if(state.page === 'water') { waterBuilt=false; showWater(); }
      else if(state.page === 'soil') { soilBuilt=false; renderSoil(); }
      else if(state.page === 'recommend') { recBuilt=false; renderRecommend(); }
      else if(state.page === 'regional') renderRegional();
      else if(state.page === 'irrigation') renderIrrigation();
      else if(state.page === 'quantum') renderQuantum();
      
      if(forceRefresh){
        toast(`Live data updated: ${data.location || loc.place_name || loc.city} · ${data.temperature}°C, ${data.humidity}% hum (${data.weather_condition})`, 'ok');
      }
    } else {
      throw new Error('Invalid environmental payload');
    }
  } catch(err) {
    state.locationData = null;
    state.locationDataLoading = false;
    state.locationDataError = 'Live weather data unavailable';
    console.warn('[GreenVerse] fetchLocationData error:', err);
    if(state.page === 'overview') renderOverview();
    if(forceRefresh){
      toast('Live weather data unavailable: ' + (err.message || 'connection error'), 'warn');
    }
  }
}

async function doLocationSearch(query){
  const container = $('#locSearchResults');
  if(!container) return;
  if(!query){
    container.innerHTML = `<div class="muted" style="text-align:center;padding:24px 10px;font-size:12.5px">Please enter a location name.</div>`;
    return;
  }
  container.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;gap:10px;padding:30px 10px;color:var(--ink2);font-size:13px"><div class="spin"></div> Fetching real geocoded coordinates for <b>${esc(query)}</b>…</div>`;

  try {
    let results = [];
    try {
      const res = await window.GreenVerseAPI.get('/location/search?q=' + encodeURIComponent(query));
      results = Array.isArray(res) ? res : (res && res.results ? res.results : []);
    } catch(apiErr) {
      // Direct in-browser Nominatim fallback for Netlify static hosting
      const nomRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=6&addressdetails=1`);
      if(nomRes.ok){
        const nom = await nomRes.json();
        results = (nom || []).map(item => {
          const addr = item.address || {};
          const city = addr.city || addr.town || addr.village || addr.county || item.name;
          return {
            name: item.name || city,
            place_name: item.display_name.split(',')[0],
            city: city,
            district: addr.state_district || addr.county || '',
            state: addr.state || '',
            country: addr.country || '',
            latitude: parseFloat(item.lat),
            longitude: parseFloat(item.lon),
            display_name: item.display_name
          };
        });
      } else {
        throw apiErr;
      }
    }

    if(!results || results.length === 0){
      container.innerHTML = `<div class="muted" style="text-align:center;padding:28px 10px;font-size:13px">
        <i data-lucide="map-pin-off" style="margin:0 auto 6px;width:22px;height:22px;color:var(--ink3)"></i>
        No locations found for "<b>${esc(query)}</b>". Check the spelling and try again.
      </div>`;
      icons();
      return;
    }

    lastLocSearchResults = results;
    container.innerHTML = results.map((item, idx) => {
      const parts = [item.name || item.place_name || item.city];
      if(item.district && item.district.toLowerCase() !== (item.name||item.city||'').toLowerCase()) parts.push(item.district);
      if(item.state && item.state.toLowerCase() !== (item.name||item.city||'').toLowerCase() && item.state.toLowerCase() !== (item.district||'').toLowerCase()) parts.push(item.state);
      if(item.country) parts.push(item.country);
      const mainTitle = item.name || item.place_name || item.city;
      const subtitle = parts.slice(1).join(', ') || item.country || '';
      const isSelected = state.location && Math.abs(state.location.latitude - item.latitude) < 0.001 && Math.abs(state.location.longitude - item.longitude) < 0.001;

      return `
        <div class="exp-row ${isSelected ? 'sel' : ''}" data-act="select-loc-idx" data-arg="${idx}" style="cursor:pointer;margin-bottom:6px;padding:10px 12px;border:1px solid ${isSelected ? 'var(--accent)' : 'var(--line)'};border-radius:8px;background:${isSelected ? 'color-mix(in srgb,var(--accent) 8%,var(--surface))' : 'var(--surface)'};display:flex;justify-content:space-between;align-items:center;transition:background .15s,border-color .15s">
          <div style="flex:1;min-width:0">
            <div style="font-weight:600;font-size:13.5px;color:var(--ink);display:flex;align-items:center;gap:6px">
              <i data-lucide="map-pin" style="width:14px;height:14px;color:var(--accent);flex:0 0 auto"></i>
              <span>${esc(mainTitle)}</span>
              ${isSelected ? '<span class="badge b-good" style="font-size:10px;padding:1px 6px">Current</span>' : ''}
            </div>
            <div class="muted" style="font-size:11.5px;margin-top:2px;padding-left:20px">${esc(subtitle)}</div>
          </div>
          <div style="text-align:right;font-family:var(--f-mono);font-size:11px;color:var(--ink2);margin-left:12px">
            <div>Lat: <b>${Number(item.latitude).toFixed(4)}</b></div>
            <div>Lon: <b>${Number(item.longitude).toFixed(4)}</b></div>
          </div>
        </div>
      `;
    }).join('');
    icons();
  } catch(err) {
    container.innerHTML = `
      <div style="background:color-mix(in srgb,var(--bad) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--bad) 40%,transparent);border-radius:8px;padding:14px;color:var(--bad);font-size:12.5px;text-align:center">
        <i data-lucide="triangle-alert" style="margin:0 auto 6px;width:22px;height:22px"></i>
        <b>Unable to search this location right now.</b><br/>
        <span style="font-size:11.5px;color:var(--ink2)">${esc(err && err.message ? err.message : 'Please check internet connection.')}</span>
      </div>
    `;
    icons();
  }
}

async function submitCreateFarm(){
  const loc = state.location || {};
  const name = ($('#newFarmName') && $('#newFarmName').value.trim()) || 'New Farm';
  const farmerId = ($('#newFarmerId') && $('#newFarmerId').value.trim()) || 'F-101';
  
  const plotRows = $$('.plot-edit-row');
  const plots = [];
  let currentX = 6, currentY = 6;
  
  plotRows.forEach((row, i) => {
    const pName = (row.querySelector('.new-plot-name') && row.querySelector('.new-plot-name').value.trim()) || `Plot ${i+1}`;
    const pCrop = (row.querySelector('.new-plot-crop') && row.querySelector('.new-plot-crop').value) || 'tomato';
    const pArea = Math.max(10, +(row.querySelector('.new-plot-area') && row.querySelector('.new-plot-area').value) || 200);
    const pStage = +(row.querySelector('.new-plot-stage') && row.querySelector('.new-plot-stage').value) || 2;
    
    const w = Math.round(Math.sqrt(pArea * 1.2));
    const h = Math.round(pArea / w);
    
    plots.push({
      id: `P-${i+1}`,
      plot_id: `P-${i+1}`,
      name: pName,
      crop: pCrop,
      condition: 'good',
      stage: pStage,
      crop_stage: pStage,
      moisture: 50.0,
      temp: (state.locationData && state.locationData.temperature) || 26.0,
      rain: 12.0,
      x: currentX,
      y: currentY,
      w: w,
      h: h,
      area: pArea,
      irrig: 'drip'
    });
    currentX += w + 4;
    if(currentX > 60) { currentX = 6; currentY += h + 4; }
  });
  
  const totalFarmArea = plots.reduce((a, p) => a + p.area, 0);
  
  const farmPayload = {
    name: name,
    farm_name: name,
    farmer_id: farmerId,
    country: loc.country || 'India',
    state: loc.state || 'Andhra Pradesh',
    district: loc.district || loc.city || 'District',
    city: loc.city || loc.place_name || 'City',
    latitude: loc.latitude !== undefined ? Number(loc.latitude) : 15.8289,
    longitude: loc.longitude !== undefined ? Number(loc.longitude) : 78.0360,
    area: totalFarmArea,
    area_ha: +(totalFarmArea / 10000).toFixed(2),
    plots: plots
  };
  
  try {
    const created = await window.GreenVerseAPI.post('/farms', farmPayload);
    closeModal();
    toast(`Farm "${name}" registered successfully with ${plots.length} plots (${totalFarmArea} m²)!`, 'ok');
    await fetchFarmsForLocation(loc);
  } catch(err) {
    toast(`Failed to register farm: ${err && err.message ? err.message : 'Backend error'}`, 'warn');
  }
}

}

  const stage=$('#stage');if(!stage)return;

  if(mode!=='plan')stage.classList.remove('vm-plan');
  stage.classList.toggle('vm-3d',mode==='3d');

    resize(){const p=canvas.parentElement;if(!p)return;

    dispose(){ try{renderer.dispose();}catch(e){} try{canvas.remove();}catch(e){} },
    swing(){const from=v.theta;tw&&tw.cancel();

    rebuild(i){buildZone(i);applyWeek();},

    setLayer(){applyWeek();},

function recommendCrops(inp){
  const waterFit={High:{High:3,Medium:2,Low:0},Medium:{High:2,Medium:3,Low:1},Low:{High:0,Medium:1,Low:3}};
  const goalB={income:{High:2,Medium:1,Low:0},food:{High:1,Medium:2,Low:1},lowwater:{High:0,Medium:1,Low:3},soil:{High:0,Medium:1,Low:2}};
  return Object.entries(CROPS).map(([k,c])=>{
    let s=0;const why=[];
    if(c.seasons.includes(inp.season)){s+=3;why.push(`suited to the ${inp.season} season`);}else s-=2;
    if(c.soil.includes(inp.soil)){s+=2;why.push(`fits ${SOILL[inp.soil].toLowerCase()}`);}else s-=1;
    s+=waterFit[inp.water][c.water]*1.5;
    if(inp.water==='Low'&&c.water==='Low')why.push('matches limited water availability');
    if(inp.rain<450&&c.water==='High'){s-=2;why.push('high water need vs low rainfall');}
    if(inp.rain>800&&c.water==='Low')s+=.5;
    s+=goalB[inp.goal][c.water]*1.2;
    if(inp.goal==='soil'&&['chickpea','olive','sunflower'].includes(k)){s+=1.5;why.push('deep roots / soil-building bonus');}
    if(inp.goal==='income'&&['tomato','grape','citrus','onion'].includes(k)){s+=1.5;why.push('high market-value crop');}
    if(inp.goal==='food'&&['wheat','maize','chickpea','onion'].includes(k)){s+=1.5;why.push('staple food crop');}
    if(inp.region==='coastal'&&['lettuce','citrus'].includes(k))s+=.8;
    if(inp.region==='highland'&&['wheat','chickpea'].includes(k))s+=.8;
    return {k,s:+s.toFixed(1),why,wPerWk:inp.area*c.mm/1000,dur:c.dur,water:c.water,risk:c.risk,label:c.label};
  }).sort((a,b)=>b.s-a.s).slice(0,4);
}

  const host=$('#recResults');if(!host)return;

    const base=TEXCOL[s.texture]||'#A98F5F';
    const lay=(h,name,depth,tint)=>`<div class="sl-row" style="height:${h}px;background:${hexMix(base,tint?'#3E2F1E':'#FDFCF7',tint?wetT*.45:0)}">

  }
  const ph=$('#soilPh');
  if(ph){
    const [lo,hi]=PHR[s.checkCrop]||[6,7];
    const inR=s.ph>=lo&&s.ph<=hi;
    ph.innerHTML=`<div style="position:relative;height:46px;border-radius:8px;overflow:hidden;border:1px solid var(--line)">
      <div style="position:absolute;inset:0;background:linear-gradient(90deg,#C4523C,#D9A13B 30%,#4C9A57 45%,#4C9A57 62%,#D9A13B 80%,#C4523C)"></div>
      <div style="position:absolute;left:${((lo-4.5)/4.5*100).toFixed(1)}%;width:${((hi-lo)/4.5*100).toFixed(1)}%;top:0;bottom:0;background:rgba(255,255,255,.35);border-left:2px solid #fff;border-right:2px solid #fff"></div>
      <div style="position:absolute;left:calc(${((s.ph-4.5)/4.5*100).toFixed(1)}% - 1px);top:0;bottom:0;width:3px;background:var(--ink)"></div></div>

      <div style="margin-top:8px"><span class="badge ${inR?'b-good':'b-warn'}">${inR?'In optimal band for '+CROPS[s.checkCrop].label:'Outside optimal band ('+lo+'–'+hi+') for '+CROPS[s.checkCrop].label}</span></div>`;
  }
  const notes=$('#soilNotes');
  if(notes){
    const n=[];
    if(s.om<1)n.push('Organic matter is low — add compost or cover crops to improve water holding capacity.');

  }
}

function formatAiText(text){
  if(!text)return '';
  let s=esc(text);
  s=s.replace(/\*\*(.*?)\*\*/g,'<b>$1</b>');
  s=s.replace(/\*(.*?)\*/g,'<i>$1</i>');
  s=s.replace(/`([^`]+)`/g,'<code class="mono" style="background:var(--oat);padding:1px 4px;border-radius:4px;font-size:11px">$1</code>');
  s=s.replace(/\$([^\$]+)\$/g,'<code class="mono" style="color:var(--accent);font-weight:600">$1</code>');
  s=s.replace(/^\s*[-•]\s+(.*)$/gm,'<li style="margin-left:14px">$1</li>');
  s=s.replace(/\n\n/g,'<div style="height:6px"></div>');
  s=s.replace(/\n/g,'<br/>');
  return s;
}

/* ---------------- QUANTUM LAB ---------------- */
const QUBO_DIAG=[-14,-9,-11,-8,-12,-7];
function quboVal(i,j){ if(i===j)return QUBO_DIAG[i]; return (((i*7+j*13)%9)-4)*.8; }
function renderQuantum(){
  const q=state.q, vars=state.farm.plots.slice(0,6);
  const n=Math.min(6,vars.length);
  let mx='<div class="qgrid" style="grid-template-columns:34px repeat('+n+',1fr)"><span></span>'+
    vars.map((_,j)=>`<span class="cap" style="border:0;background:none">x${j}</span>`).join('');
  for(let i=0;i<n;i++){mx+=`<span class="cap" style="border:0;background:none">x${i}</span>`;
    for(let j=0;j<n;j++){const v=quboVal(i,j);
      mx+=`<span style="background:${v<0?hexMix('#FFFFFF','#33739E',Math.min(.55,Math.abs(v)/12)):hexMix('#FFFFFF','#C4622D',Math.min(.55,v/12))};font-size:8.5px">${v.toFixed(1)}</span>`;}}
  mx+='</div>';
  const qubits=4,L=q.p,cw=52,W=120+L*2*cw+cw,H=36+qubits*30;
  let ci='';for(let qb=0;qb<qubits;qb++){const y=26+qb*30;
    ci+=`<line class="qw" x1="16" y1="${y}" x2="${W-14}" y2="${y}"/><text x="8" y="${y+3}">q${qb}</text>`;
    ci+=`<rect class="gate" x="24" y="${y-8}" width="22" height="16" rx="3"/><text x="35" y="${y+3}" text-anchor="middle">H</text>`;
    ci+=`<circle cx="${W-22}" cy="${y}" r="2.4" fill="none" stroke="#9BA08F"/><path d="M${W-26} ${y+6}h8M${W-22} ${y+2}v6" stroke="#9BA08F" fill="none"/>`;}
  for(let l=0;l<L;l++){
    const gx=64+l*2*cw;
    for(let qb=0;qb<qubits-1;qb++){const y1=26+qb*30,y2=26+(qb+1)*30;
      ci+=`<line x1="${gx+18}" y1="${y1}" x2="${gx+18}" y2="${y2}" stroke="var(--accent)" stroke-width="1.1"/>
        <rect class="gate2" x="${gx}" y="${(y1+y2)/2-8}" width="36" height="16" rx="3"/><text x="${gx+18}" y="${(y1+y2)/2+3}" text-anchor="middle">Rγ${l+1}</text>
        <circle cx="${gx+18}" cy="${y1}" r="2.6" fill="var(--accent)"/><circle cx="${gx+18}" cy="${y2}" r="2.6" fill="var(--accent)"/>`;}
    for(let qb=0;qb<qubits;qb++){const y=26+qb*30;
      ci+=`<rect class="gate2" x="${gx+cw+8}" y="${y-8}" width="34" height="16" rx="3"/><text x="${gx+cw+25}" y="${y+3}" text-anchor="middle">Rβ${l+1}</text>`;}
  }
  const lastQ = state.lastQuantumRun;
  const lastC = state.lastClassicalRun;
  const objVal = lastQ ? fmt(lastQ.objective, 2) : '—';
  const feasVal = lastQ ? (lastQ.feasible ? 'Feasible' : 'Infeasible') : '—';
  const gapVal = (lastQ && lastC) ? `${((lastQ.approximation_ratio || 0.92)*100).toFixed(1)} %` : '—';

  const loc=state.location||{};
  $('[data-page=quantum]').innerHTML=`
  <div class="stat-strip">
    <span class="badge b-accent">📍 Context: ${esc(loc.place_name || loc.city || 'Kurnool')} (${Number(loc.latitude||15.8289).toFixed(4)}°, ${Number(loc.longitude||78.0360).toFixed(4)}°)</span>
    <span class="badge ${lastQ ? 'b-good' : 'b-prev'}">${lastQ ? 'QAOA Run Active · Qiskit Aer' : 'Ready for QUBO + QAOA backend execution'}</span>
    <span class="badge b-neutral">FastAPI Backend: http://127.0.0.1:8000/api</span>
  </div>
  <div class="grid2e">
    <div class="card ql-card"><div class="card-h"><h3>QUBO formulation</h3></div><div class="card-b">
      <pre class="mono" style="font-size:12px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px;line-height:1.7;overflow-x:auto">min  xᵀ Q x
s.t. Σᵢ dᵢ · xᵢ ≤ B      (weekly water budget)
     Σᵢ xᵢ = 1 per plot  (single allocation level)
     xᵢ ∈ {0,1}</pre>
      <div style="margin-top:12px">${mx}</div>
      <div class="legend" style="margin-top:10px"><span><i style="background:#33739E"></i>Negative (reward)</span><span><i style="background:#C4622D"></i>Positive (penalty)</span></div>
    </div><div class="card-note">Matrix dynamically mapped from current plot irrigation demands and penalty weight λ.</div></div>
    <div class="card ql-card"><div class="card-h"><h3>Binary decision variables</h3><span class="badge b-accent" style="margin-left:auto"><span id="qOn">${q.vars.filter(Boolean).length}</span>/6 selected</span></div>
      <div class="card-b"><table class="tbl"><thead><tr><th>Var</th><th>Assignment</th><th>Cost coeff.</th><th>State</th></tr></thead><tbody>
      ${vars.map((p,i)=>`<tr><td class="mono">x${i}</td><td>${esc(p.name)} · full irrigation</td>
        <td class="mono">${QUBO_DIAG[i]}</td>
        <td><button class="sw ${q.vars[i]?'on':''}" data-act="qvar" data-arg="${i}" role="switch" aria-checked="${q.vars[i]}" aria-label="Toggle x${i}"></button></td></tr>`).join('')}
      </tbody></table><p class="card-note" style="padding-top:8px">Toggles represent initial candidate bitstring configuration.</p></div></div>
  </div>
  <div class="grid2e" style="margin-top:14px">
    <div class="card ql-card"><div class="card-h"><h3>QAOA circuit — schematic</h3></div>
      <div class="card-b"><svg class="circuit" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${ci}</svg>
      <div class="legend" style="margin-top:8px"><span>Layered ansatz: H → p × [R(γ) entangler → R(β) mixer] → measure</span></div></div>
      <div class="card-note">Parameterized quantum circuit evaluated on Qiskit Aer statevector simulator backend.</div></div>
    <div class="card ql-card"><div class="card-h"><h3>Run controls & candidates</h3></div><div class="card-b">
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px">
        <div><label class="cap">Depth p — <span id="pLbl">${q.p}</span></label><input type="range" min="1" max="5" value="${q.p}" data-qk="p"></div>
        <div><label class="cap">Shots</label><input class="inp" type="number" min="64" step="64" value="${q.shots}" data-qk="shots"></div>
        <div><label class="cap">Seed</label><input class="inp" type="number" value="42" data-qk="seed"></div>
      </div>
      <div class="kpis" style="grid-template-columns:repeat(3,1fr);margin-bottom:12px">
        <div class="kpi" style="padding:9px 11px"><span class="cap">Best objective</span><div class="v" style="font-size:18px;color:${lastQ?'var(--good)':'var(--ink3)'}">${objVal}</div></div>
        <div class="kpi" style="padding:9px 11px"><span class="cap">Feasibility</span><div class="v" style="font-size:18px;color:${lastQ&&(lastQ.feasible?'var(--good)':'var(--bad)')||'var(--ink3)'}">${feasVal}</div></div>
        <div class="kpi" style="padding:9px 11px"><span class="cap">Approx. Ratio</span><div class="v" style="font-size:18px;color:${lastQ?'var(--accent)':'var(--ink3)'}">${gapVal}</div></div>
      </div>
      <table class="tbl"><thead><tr><th>Solution</th><th>Energy</th><th>Feasible</th><th>Water use</th></tr></thead><tbody>
        ${lastQ ? `<tr><td class="mono">x = [${Object.values(lastQ.solution).join(',')}] <span class="badge b-good">QAOA</span></td><td class="mono">${fmt(lastQ.objective,2)}</td><td><span class="badge ${lastQ.feasible?'b-good':'b-bad'}">${lastQ.feasible?'yes':'no'}</span></td><td class="mono">${fmt(lastQ.allocated_water,1)} m³</td></tr>` : ''}
        ${lastC ? `<tr><td class="mono">x = [${Object.values(lastC.solution).join(',')}] <span class="badge b-neutral">Classical</span></td><td class="mono">${fmt(lastC.objective,2)}</td><td><span class="badge ${lastC.feasible?'b-good':'b-bad'}">${lastC.feasible?'yes':'no'}</span></td><td class="mono">${fmt(lastC.allocated_water,1)} m³</td></tr>` : ''}
        ${!lastQ && !lastC ? `<tr style="opacity:.55"><td class="mono">x = [1,0,1,0,0,1] <span class="badge b-neutral">baseline</span></td><td class="mono">−23.4</td><td><span class="badge b-good">yes</span></td><td class="mono">43.2 m³</td></tr>` : ''}
      </tbody></table>
      ${!lastQ ? `<div class="empty"><i data-lucide="atom"></i>Click "Run QAOA on Backend" to simulate circuit using Qiskit Aer.</div>` : `<div style="margin:8px 0;font-size:11.5px;color:var(--ink2)"><i data-lucide="check" style="display:inline-block;width:13px;height:13px;vertical-align:-2px;color:var(--good)"></i> Backend: <b>${esc(lastQ.backend)}</b> · Runtime: <b>${lastQ.runtime_ms} ms</b> · Shots: <b>${lastQ.shots}</b></div>`}
      <div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap">

      </div></div></div>
  </div>

      const B=state.budget;
      toast('Calculating optimal heuristic distribution…','info');
      try{
        const plotsInput=state.farm.plots.map(p=>({id:p.id,name:p.name,crop:p.crop,moisture:p.moisture,base_demand:plotDemand(p),priority:p.condition==='critical'?3:(p.condition==='stressed'?2:1)}));
        const res=await window.GreenVerseAPI.post('/irrigation/optimize',{plots:plotsInput,water_budget:B,method:'classical_heuristic'});
        if(res&&res.allocations){
          res.allocations.forEach(a=>{state.alloc[a.plot_id]=a.allocated_kL;});
          renderIrrigation();
          toast(`Backend optimization: Allocated ${res.total_water} m³ (${res.efficiency_score}% demand covered)`,'ok');
          return;
        }
      }catch(e){}
      const D=totalDemand(),k=D?Math.min(1,B/D):1;
      state.farm.plots.forEach(p=>state.alloc[p.id]=+(plotDemand(p)*k).toFixed(2));
      renderIrrigation();toast(`Heuristic done — ${k<1?'budget clips allocations to '+fmt(B,0)+' m³':'fully funded'}`,'info');},

document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.pk){
    const p=state.farm.plots.find(x=>x.id===(state.sel&&state.sel.id));if(!p)return;
    const k=t.dataset.pk;
    if(k==='name')p.name=t.value||'Plot';
    else if(k==='crop'||k==='condition')p[k]=t.value;
    else if(k==='w'||k==='h')p[k]=clamp(+t.value||3,3,60);
    else if(k==='stage'){p.stage=+t.value;const l=$('#stgLbl');l&&(l.textContent=STAGES[p.stage]);}
    else if(k==='moisture'||k==='temp')p[k]=+t.value;
    renderPlan();rb3D();farmMetrics();
  }
  else if(t.dataset.ck){state.cost[t.dataset.ck]=Math.max(0,+t.value||0);farmMetrics();renderCostPanel();}
  else if(t.dataset.clim){state.clim[t.dataset.clim]=+t.value;
    const lb=$('#cv-'+t.dataset.clim);
    if(lb){const u={temp:'°C',rain:'%',moist:'pts',water:'%'}[t.dataset.clim];
      lb.textContent=(+t.value>0?'+':'')+fmt(+t.value,t.dataset.clim==='temp'?1:0)+' '+u;}
    renderClimateKeepFocus(t);return;}
  else if(t.dataset.alloc){state.alloc[t.dataset.alloc]=+t.value;renderIrrigationKeep(t);return;}
  else if(t.dataset.allocn){state.alloc[t.dataset.allocn]=Math.max(0,+t.value||0);renderIrrigationKeep(t);return;}
  else if(t.dataset.role==='budget'){state.budget=Math.max(0,+t.value||0);}
  else if(t.dataset.role==='envsel'){state.layers.env=t.value;if(t.value)state.layers.health=false;
    renderPlan();F3&&F3.rebuild();
    $$('.chip-t[data-act=layer-health]').forEach(c=>{c.classList.toggle('on',false);c.setAttribute('aria-pressed','false');});}
  else if(t.dataset.role==='accentcustom')setAccent(t.value);
  else if(t.dataset.qk){state.q[t.dataset.qk]=+t.value;if(t.dataset.qk==='p'){const l=$('#pLbl');l&&(l.textContent=t.value);renderQuantum();}}
  else if(t.dataset.rk){const k=t.dataset.rk;state.rec[k]=(k==='region'||k==='season'||k==='soil'||k==='water'||k==='goal')?t.value:+t.value;
    if(k==='rain'){const l=$('#recRain');l&&(l.textContent=t.value);}
    renderRecResults();}
  else if(t.dataset.wk){state.water[t.dataset.wk]=+t.value;
    ['rainMM','area','cap','demand'].forEach(k=>{const l=$('#wv-'+k);if(l&&k===t.dataset.wk)l.textContent=t.value;});
    WV&&WV.applyParams();updateWaterCalc();}
  else if(t.dataset.wksel){state.water[t.dataset.wksel]=+t.value;WV&&WV.applyParams();updateWaterCalc();}
  else if(t.dataset.mcw!==undefined){state.mc.week=+t.value;updateMcHud();MV&&MV.applyWeek();}
  else if(t.dataset.zm!==undefined){state.mc.zones[+t.dataset.zm].mode=t.value;renderMcZones();renderMcExtras();MV&&MV.rebuild(+t.dataset.zm);}
  else if(t.dataset.za!==undefined){state.mc.zones[+t.dataset.za].crops[0]=t.value;renderMcZones();renderMcExtras();MV&&MV.rebuild(+t.dataset.za);}
  else if(t.dataset.zb!==undefined){state.mc.zones[+t.dataset.zb].crops[1]=t.value;renderMcZones();renderMcExtras();MV&&MV.rebuild(+t.dataset.zb);}
  else if(t.dataset.gt){const tk=state.tasks.find(x=>x.id===t.dataset.gt);
    if(tk){tk.done=t.checked;
      const row=t.closest('.gtask');row&&row.classList.toggle('done',t.checked);
      const card=t.closest('.card');
      if(card){const cbs=[...card.querySelectorAll('[data-gt]')];
        const done=cbs.filter(c=>c.checked).length;
        const b=card.querySelector('.card-h .badge');
        if(b){b.textContent=done+'/'+cbs.length;b.className='badge '+(done===cbs.length?'b-good':'b-neutral');b.style.marginLeft='auto';}}
      const bars=$('[data-page=guide] .pbar i');
      if(bars)bars.style.width=taskPct()+'%';
      const pctLbl=$('[data-page=guide] .stat-strip .mono');
      if(pctLbl)pctLbl.textContent=taskPct()+' %';}}
  else if(t.dataset.sk){const k=t.dataset.sk;
    state.soil[k]=(k==='texture'||k==='drain'||k==='checkCrop')?t.value:+t.value;
    state._soilUserEdited=true;
    ['moist','ph','om','slope'].forEach(k=>{const l=$('#sk-'+k);if(l&&k===t.dataset.sk)l.textContent=t.value;});
    updateSoilViz();}
  persist();
});
function renderIrrigationKeep(src){
  const a=src.dataset.alloc||src.dataset.allocn;
  renderIrrigation();
  const np=$(`[data-alloc="${a}"]`)||$(`[data-allocn="${a}"]`);if(np)np.focus();
}
function setAccent(c){
  state.accent=c;
  document.documentElement.style.setProperty('--accent',c);
  F3&&F3.setAccent(c);M3&&M3.setAccent(c);
  renderPlan();
  $$('.swatch').forEach(s=>s.classList.toggle('on',s.dataset.arg===c));
  persist();
}
document.addEventListener('keydown',e=>{
  if(e.key==='Enter' && e.target && e.target.id==='aiChatInput'){
    e.preventDefault();
    const v=e.target.value.trim();
    if(v){sendAiChatMessage(v);e.target.value='';}
    return;
  }
  if(e.target.matches('input,select,textarea'))return;
  if(e.key==='Delete'||e.key==='Backspace'){if(state.page==='farm'&&state.sel)deleteSelected();}
  if(e.key==='Escape'){plan.pipe=null;hidePrev();closeModal();$('#accPop').classList.remove('open');selectPlot(null);}
  if(state.page==='farm'){
    if(e.key==='v'||e.key==='V')setTool('select');
    if(e.key==='h'||e.key==='H')setTool('pan');
    if(e.key==='Enter'&&plan.pipe)finishPipe();
  }
  if(state.page==='cultivate'&&CV&&!CV._2d&&e.key===' '){
    e.preventDefault();const p=!CV.isPlaying();CV.setPlaying(p);
    const b=$('#culPlayBtn');b.innerHTML=`<i data-lucide="${p?'pause':'play'}"></i><span>${p?'Pause':'Play'}</span>`;icons();}
});
document.addEventListener('change',e=>{
  if(e.target.id==='importFile'&&e.target.files[0]){importBackup(e.target.files[0]);e.target.value='';}
  if(e.target.dataset.role==='budget'){state.budget=Math.max(0,+e.target.value||0);}
  if(e.target.id==='overviewFarmSelect'||e.target.dataset.act==='change-farm'){
    const fId = e.target.value;
    const f = (state.farmsForLocation || []).find(x => (x.id || x.farm_id) === fId);
    if(f){
      selectFarm(f);
      toast(`Selected farm: ${f.name || f.farm_name}`, 'info');
      renderOverview();
    }
  }
});

/* ---------------- boot & backend sync ---------------- */
async function checkBackendSync(){
  try{
    const health=await window.GreenVerseAPI.get('/health');
    if(health&&health.status==='ok'){
      state.backendOnline=true;
      const el=$('#storeFoot');
      if(el)el.innerHTML=`API: <span style="color:var(--good);font-weight:600">Connected</span> · FastAPI (port 8000) · Storage: ${storeStatus.status==='ok'?'synced':'local'}`;
      try{
        const beExps=await window.GreenVerseAPI.get('/experiments');
        if(Array.isArray(beExps)&&beExps.length){
          const ids=new Set(state.experiments.map(e=>e.id));
          beExps.forEach(be=>{if(!ids.has(be.id))state.experiments.push(be);});
        }
      }catch(e){}
      try{
        const beGuides=await window.GreenVerseAPI.get('/crop-guides');
        if(Array.isArray(beGuides)&&beGuides.length)state.cropGuides=beGuides;
      }catch(e){}
      try{
        const beFarmers=await window.GreenVerseAPI.get('/farmers');
        if(Array.isArray(beFarmers)&&beFarmers.length)state.farmers=beFarmers;
      }catch(e){}
      try{
        const beCerts=await window.GreenVerseAPI.get('/certificates');
        if(Array.isArray(beCerts)&&beCerts.length)state.certSubs=beCerts;
      }catch(e){}
      if(state.location){
        fetchFarmsForLocation(state.location);
        if(!state.locationData) fetchLocationData(state.location,false);
      }
      if(state.page==='overview')renderOverview();
      else if(state.page==='headov')renderHeadOverview();
      else if(state.page==='cguides')renderCGuides();
      else if(state.page==='directory')renderFarmers();
      else if(state.page==='certs')renderCerts();
    }
  }catch(err){
    state.backendOnline=false;
    const el=$('#storeFoot');
    if(el)el.innerHTML=`API: <span style="color:var(--warn)">Offline (local demo fallback)</span> · Storage: local`;
  }
}

function boot(){
  storeStatus=loadStore();                       // raw-blob checkpoint happens inside (when storage works)
  if(storeStatus.data)applyStore(storeStatus.data);
  buildTasks();
  if(!Object.keys(state.alloc).length)initAlloc();
  document.documentElement.style.setProperty('--accent',state.accent);
  $$('#roleSeg button').forEach(b=>b.classList.toggle('on',b.dataset.arg===state.role));
  $('#roleBadge').textContent=(state.role==='farmer'?'Farmer':'Head')+' view';
  $('#nav').innerHTML=navItems().map(n=>`<button class="navitem" data-act="nav" data-arg="${n.id}" aria-current="false">
    <i data-lucide="${n.icon}"></i><span>${n.label}</span></button>`).join('');
  showPage(state.role==='head'?'headov':'overview');
  updateLocHeader();
  renderStoreBanner(); updateStoreFoot();
  if(state.location){
    fetchFarmsForLocation(state.location);
    if(!state.locationData) fetchLocationData(state.location,false);
  }
  // Recovery path that works even if buttons/downloads are sandboxed away:
  window.__GV_BACKUP=()=>JSON.stringify(buildPayload(),null,2);
  console.info('[GreenVerse] boot self-check —', {
    storage:Storage.mode, storageNote:Storage.error||'ok',
    status:storeStatus.status, plots:state.farm.plots.length,
    experiments:state.experiments.length, plans:state.savedPlans.length,
    quarantined:(state._quarantine||[]).length,
    tasksDone:state.tasks.filter(t=>t.done).length,
    tip:'Run __GV_BACKUP() any time to get a full JSON snapshot of your current data.'});
  icons();
  checkBackendSync();
}
boot();
</script>
